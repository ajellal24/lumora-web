<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0719">
<title>Lumora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0719;--sf:#141029;--sf2:#1D1738;--ol:#2E2552;--vi:#7C3AED;--mg:#D946EF;--gold:#F5C451;--cy:#4DD4E6;--tx:#fff;--tx2:#B7AEDB}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{background:radial-gradient(120% 60% at 50% -10%,#2a1060 0%,var(--bg) 60%) no-repeat,var(--bg);color:var(--tx);font-family:Cairo,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;gap:8px;align-items:center;padding:10px 16px;position:sticky;top:0;background:rgba(10,7,25,.92);backdrop-filter:blur(8px);z-index:5;border-bottom:1px solid var(--ol)}
.logo{font-size:24px;font-weight:700;background:linear-gradient(90deg,var(--vi),var(--mg));-webkit-background-clip:text;background-clip:text;color:transparent}
.sp{flex:1}
select,input{background:var(--sf);color:var(--tx);border:1px solid var(--ol);border-radius:12px;padding:12px;font:inherit;width:100%}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--mg);outline-offset:1px}
header select{width:auto;padding:6px 8px}
.c{max-width:560px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:12px}
h1{font-size:28px;line-height:1.3}h2{font-size:20px}h3{font-size:15px;color:var(--tx2);font-weight:600;margin-top:6px}
button{font:inherit;border:0;border-radius:22px;padding:12px 18px;color:#fff;cursor:pointer}
.pri{background:linear-gradient(90deg,var(--vi),var(--mg));box-shadow:0 0 18px rgba(124,58,237,.4);font-weight:700}
.sec{background:var(--sf2);border:1px solid var(--ol)}
.ghost{background:none;color:var(--tx2);padding:6px 10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card{background:var(--sf);border:1px solid var(--ol);border-radius:18px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
small,.note{color:var(--tx2)}
.gold{color:var(--gold)}
.note{background:var(--sf2);border-radius:12px;padding:10px;font-size:14px}
.seats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;text-align:center}
.seat small{display:block;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:56px;height:56px;border-radius:50%;margin:0 auto 4px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;background:linear-gradient(135deg,var(--vi),var(--mg))}
.av.own{box-shadow:0 0 0 3px var(--gold),0 0 16px rgba(245,196,81,.5)}
.av.empty{background:var(--sf);border:1px dashed var(--ol);color:var(--tx2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--sf2);border-radius:14px;padding:4px 10px;font-size:13px}
.chat{height:240px;overflow:auto;background:var(--sf);border:1px solid var(--ol);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px}
.m b{color:var(--cy)}
.send{display:flex;gap:8px}.send input{flex:1}
#toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));inset-inline:16px;background:var(--vi);padding:12px;border-radius:12px;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.show{opacity:1}
@keyframes fl{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1}100%{transform:translateY(-55vh) scale(1.6);opacity:0}}
.fly{position:fixed;bottom:18vh;font-size:44px;pointer-events:none;z-index:50;animation:fl 2.4s ease-out forwards}
@media (prefers-reduced-motion:reduce){.fly{animation-duration:.01s}}
</style>

const T = {

};
Object.assign(T.en,{priv:'Private room',pw:'Password',code:'Room ID',joinPriv:'Join private room',gift:'Send gift',to:'To',bal:'Coins',nogift:'No other member',gsent:'Gift sent',newname:'New display name',gmsg:'sent',vjoin:'Join voice',vleave:'Leave voice',mic:'Mic',micoff:'Mic off',nomic:'Only speakers can use the mic'});
Object.assign(T.fr,{priv:'Salon privé',pw:'Mot de passe',code:'ID du salon',joinPriv:'Rejoindre un salon privé',gift:'Envoyer un cadeau',to:'À',bal:'Pièces',nogift:'Aucun autre membre',gsent:'Cadeau envoyé',newname:'Nouveau nom affiché',gmsg:'a envoyé',vjoin:'Rejoindre la voix',vleave:'Quitter la voix',mic:'Micro',micoff:'Micro coupé',nomic:'Seuls les orateurs ont le micro'});
Object.assign(T.ar,{priv:'غرفة خاصة',pw:'كلمة المرور',code:'رقم الغرفة',joinPriv:'دخول غرفة خاصة',gift:'إرسال هدية',to:'إلى',bal:'العملات',nogift:'لا يوجد عضو آخر',gsent:'تم إرسال الهدية',newname:'الاسم الجديد',gmsg:'أرسل',vjoin:'دخول الصوت',vleave:'خروج من الصوت',mic:'المايك',micoff:'إيقاف المايك',nomic:'المايك للمتحدثين فقط'});
let lang = 'en'; try { lang = localStorage.getItem('lang') || (navigator.language||'en').slice(0,2); } catch(e){}
if (!T[lang]) lang = 'en';
const t = k => (T[lang] && T[lang][k]) || T.en[k] || k;
const $ = s => document.querySelector(s), app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rank = r => ({owner:5,admin:4,moderator:3,speaker:2,listener:1}[r] || 0);
let user = null, view = '', cur = null, members = [], names = {}, ch = null;

function toast(m){ const e=$('#toast'); e.textContent=m; e.className='show'; clearTimeout(toast.h); toast.h=setTimeout(()=>e.className='',3500); }
function setLang(l){ lang=l; try{localStorage.setItem('lang',l)}catch(e){} document.documentElement.lang=l; document.documentElement.dir=l==='ar'?'rtl':'ltr'; route(); }
function hdr(logged){ return `<header><span class="logo">Lumora</span><span class="sp"></span><select id="lg" aria-label="Language"><option value="en">EN</option><option value="fr">FR</option><option value="ar">AR</option></select>${logged?`<button class="ghost" id="nm">✎</button><button class="ghost" id="lo">${t('logout')}</button>`:''}</header>`; }
function bindHdr(){ $('#lg').value=lang; $('#lg').onchange=e=>setLang(e.target.value); const lo=$('#lo'); if(lo) lo.onclick=()=>sb.auth.signOut();
  const nm=$('#nm'); if(nm) nm.onclick=async()=>{ const v=(prompt(t('newname'))||'').trim(); if(!v) return;
    const {error}=await sb.from('profiles').update({display_name:v}).eq('id',user.id); if(error) return toast(error.message); names[user.id]=v; toast('✓ '+v); } }
function cleanup(){ voiceLeave(); if(ch){ sb.removeChannel(ch); ch=null; } }

function route(){
  if(!user){ cleanup(); view='auth'; return authView(); }
  if(view==='room' && cur) return openRoom(cur.id);
  if(view==='create') return createView();
  view='rooms'; roomsView();
}

function authView(){
  document.documentElement.dir = lang==='ar'?'rtl':'ltr';
  app.innerHTML = hdr(false)+`<main class="c"><h1>${t('welcome')}</h1>
    <input id="nm" placeholder="${t('name')}" maxlength="40" autocomplete="nickname">
    <input id="em" type="email" placeholder="${t('email')}" autocomplete="email">
    <input id="pw" type="password" placeholder="${t('password')}" autocomplete="current-password">
    <button class="pri" id="in">${t('signin')}</button><button class="sec" id="up">${t('signup')}</button></main>`;
  bindHdr();
  const cred = () => ({ email: $('#em').value.trim(), password: $('#pw').value });
  const guard = () => { if (CFG.key.startsWith('PASTE')) { toast(t('nokey')); return true; } };
  $('#in').onclick = async () => { if(guard())return; const {error}=await sb.auth.signInWithPassword(cred()); if(error) toast(error.message); };
  $('#up').onclick = async () => { if(guard())return; const {data,error}=await sb.auth.signUp({...cred(), options:{data:{name:$('#nm').value.trim()}}}); if(error) return toast(error.message); if(!data.session) toast(t('checkEmail')); };
}

async function roomsView(){
  app.innerHTML = hdr(true)+`<main class="c"><div class="row"><h2>${t('rooms')}</h2><button class="pri" id="new">+ ${t('create')}</button></div><div class="row"><input id="pc" placeholder="${t('code')}" inputmode="numeric"><input id="pp" type="password" placeholder="${t('pw')}"><button class="sec" id="pj">${t('joinPriv')}</button></div><div id="list" class="c" style="padding:0"></div></main>`;
  bindHdr(); $('#new').onclick=()=>{ view='create'; createView(); };
  $('#pj').onclick=async()=>{ const {data,error}=await sb.rpc('join_room_by_code',{p_public_id:+$('#pc').value,p_password:$('#pp').value||null}); if(error) return toast(error.message); cur={id:data}; view='room'; openRoom(data); };
  const draw=async(quiet)=>{
  const {data,error}=await sb.from('rooms').select('id,public_id,name,category,capacity,seat_count,participant_count').eq('is_live',true).order('participant_count',{ascending:false}).limit(30);
  if(error) return quiet?0:toast(error.message);
  const L=$('#list'); if(!L) return;
  if(!data.length){ L.innerHTML=`<p class="note">${t('empty')}</p>`; return; }
  L.innerHTML=data.map(r=>`<div class="card" tabindex="0" data-id="${r.id}"><div class="row"><b>${esc(r.name)}</b><span class="gold">● ${r.participant_count}/${r.capacity}</span></div><small>${t('c_'+r.category)} · #${r.public_id}</small></div>`).join('');
  L.querySelectorAll('.card').forEach(el=>{ const go=()=>join(data.find(x=>x.id===el.dataset.id)); el.onclick=go; el.onkeydown=e=>{if(e.key==='Enter')go()}; });
  };
  await draw(false);
  clearInterval(window._rl); window._rl=setInterval(()=>{ if($('#list')) draw(true); else clearInterval(window._rl); },5000);
}

async function join(r){
  const {error}=await sb.rpc('join_room',{p_room:r.id,p_password:null});
  if(error) return toast(error.message);
  cur=r; view='room'; openRoom(r.id);
}

function createView(){
  app.innerHTML = hdr(true)+`<main class="c"><h2>${t('create')}</h2>
    <input id="rn" placeholder="${t('roomName')}" maxlength="60">
    <select id="rc" aria-label="${t('category')}">${['friendship','music','gaming','discussion','other'].map(c=>`<option value="${c}">${t('c_'+c)}</option>`).join('')}</select>
    <select id="rs" aria-label="${t('seats')}"><option value="4">${t('seats')}: 4</option><option value="8" selected>${t('seats')}: 8</option><option value="12">${t('seats')}: 12</option></select>
    <label class="note"><input type="checkbox" id="pv"> ${t('priv')}</label><input id="rp" type="password" placeholder="${t('pw')}"><button class="pri" id="ok">${t('createRoom')}</button><button class="sec" id="no">${t('cancel')}</button></main>`;
  bindHdr(); $('#no').onclick=()=>{ view='rooms'; roomsView(); };
  $('#ok').onclick=async()=>{
    const {data,error}=await sb.rpc('create_room',{p_name:$('#rn').value.trim(),p_description:null,p_category:$('#rc').value,p_language:lang,p_cover_url:null,p_is_private:$('#pv').checked,p_capacity:50,p_seat_count:+$('#rs').value,p_password:$('#pv').checked?($('#rp').value||null):null});
    if(error) return toast(error.message);
    const {data:r}=await sb.from('rooms').select('*').eq('id',data).single(); cur=r; view='room'; openRoom(r.id);
  };
}

async function openRoom(id){
  cleanup(); view='room';
  const {data:r,error}=await sb.from('rooms').select('*').eq('id',id).single();
  if(error||!r){ view='rooms'; cur=null; return roomsView(); }
  cur=r;
  app.innerHTML = hdr(true)+`<main class="c"><div class="row"><div><h2>${esc(r.name)}</h2><small id="cnt"></small></div><button class="sec" id="lv">${t('leave')}</button></div>
    <p class="note">🎙 ${t('voiceSoon')}</p><h3>${t('speakers')}</h3><div id="seats" class="seats"></div><div id="acts" class="c" style="padding:0"></div>
    <div id="vo" class="row"></div><div id="gf" class="c" style="padding:0"></div><h3>${t('listeners')}</h3><div id="lis" class="chips"></div><h3>${t('chat')}</h3><div id="chat" class="chat"></div>
    <div class="send"><input id="mi" placeholder="${t('msg')}" maxlength="500"><button class="pri" id="sd">${t('send')}</button></div></main>`;
  bindHdr();
  $('#lv').onclick=async()=>{ await sb.rpc('leave_room',{p_room:id}); cleanup(); cur=null; view='rooms'; roomsView(); };
  const send=async()=>{ const b=$('#mi').value.trim(); if(!b) return; $('#mi').value=''; const {error}=await sb.from('messages').insert({room_id:id,sender_id:user.id,body:b}); if(error) toast(error.message); };
  $('#sd').onclick=send; $('#mi').onkeydown=e=>{ if(e.key==='Enter') send(); };
  await loadMembers(); giftPanel(); renderVoice();
  const {data:ms}=await sb.from('messages').select('id,sender_id,body').eq('room_id',id).order('created_at',{ascending:false}).limit(50);
  for(const m of (ms||[]).reverse()) await addMsg(m);
  ch=sb.channel('room-'+id)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'room_id=eq.'+id},p=>addMsg(p.new))
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'gift_events',filter:'room_id=eq.'+id},p=>addGift(p.new))
    .on('postgres_changes',{event:'*',schema:'public',table:'room_members',filter:'room_id=eq.'+id},()=>loadMembers())
    .on('postgres_changes',{event:'*',schema:'public',table:'speaker_requests',filter:'room_id=eq.'+id},()=>loadMembers())
    .subscribe();
}

const ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]};
let vc=null,vpeers={},vstream=null,vjoined=false;
function myRole(){ const m=members.find(x=>x.user_id===user.id); return m?m.role:'listener'; }
function renderVoice(){ const v=$('#vo'); if(!v) return;
  v.innerHTML=`<button class="sec" id="vj">${vjoined?'🔇 '+t('vleave'):'🎧 '+t('vjoin')}</button>${vjoined?`<button class="${vstream?'pri':'sec'}" id="vm">🎙 ${vstream?t('micoff'):t('mic')}</button>`:''}`;
  $('#vj').onclick=()=>{ if(vjoined){ voiceLeave(); renderVoice(); } else voiceJoin(); };
  const m=$('#vm'); if(m) m.onclick=micToggle; }
function vsend(to,d){ vc&&vc.send({type:'broadcast',event:'sig',payload:{from:user.id,to,...d}}); }
function drop(id){ const pc=vpeers[id]; if(pc){ try{pc.close();}catch(e){} delete vpeers[id]; } const a=document.getElementById('a'+id); if(a) a.remove(); }
function mkPeer(id){ const pc=new RTCPeerConnection(ICE); vpeers[id]=pc; pc._q=[];
  pc.onicecandidate=e=>{ if(e.candidate) vsend(id,{c:e.candidate}); };
  pc.ontrack=e=>{ let a=document.getElementById('a'+id); if(!a){ a=document.createElement('audio'); a.id='a'+id; a.autoplay=true; a.setAttribute('playsinline',''); document.body.appendChild(a); }
    a.srcObject=e.streams[0]||new MediaStream([e.track]); a.play().catch(()=>{}); };
  pc.onconnectionstatechange=()=>{ if(pc.connectionState==='failed') drop(id); };
  return pc; }
function curTrack(){ return vstream?vstream.getAudioTracks()[0]:null; }
async function vconnect(id){ const pc=mkPeer(id); const tr=pc.addTransceiver('audio',{direction:'sendrecv'}); if(curTrack()) tr.sender.replaceTrack(curTrack());
  await pc.setLocalDescription(await pc.createOffer()); vsend(id,{d:pc.localDescription}); }
async function onSig(p){ if(p.to!==user.id) return; let pc=vpeers[p.from];
  if(p.d&&p.d.type==='offer'){ if(pc) drop(p.from); pc=mkPeer(p.from); await pc.setRemoteDescription(p.d);
    const tr=pc.getTransceivers()[0]; tr.direction='sendrecv'; if(curTrack()) tr.sender.replaceTrack(curTrack());
    pc._q.forEach(c=>pc.addIceCandidate(c).catch(()=>{})); pc._q=[];
    await pc.setLocalDescription(await pc.createAnswer()); vsend(p.from,{d:pc.localDescription}); }
  else if(p.d&&pc){ await pc.setRemoteDescription(p.d); pc._q.forEach(c=>pc.addIceCandidate(c).catch(()=>{})); pc._q=[]; }
  else if(p.c&&pc){ if(pc.remoteDescription) pc.addIceCandidate(p.c).catch(()=>{}); else pc._q.push(p.c); } }
function voiceJoin(){ if(vjoined||!cur) return; vjoined=true;
  vc=sb.channel('voice-'+cur.id,{config:{presence:{key:user.id},broadcast:{self:false}}});
  vc.on('broadcast',{event:'sig'},({payload})=>onSig(payload))
    .on('presence',{event:'sync'},()=>{ const ids=Object.keys(vc.presenceState());
      ids.forEach(id=>{ if(id!==user.id&&!vpeers[id]&&user.id<id) vconnect(id); });
      Object.keys(vpeers).forEach(id=>{ if(!ids.includes(id)) drop(id); }); })
    .subscribe(st=>{ if(st==='SUBSCRIBED') vc.track({on:1}); });
  renderVoice(); }
async function micToggle(){ if(vstream){ vstream.getTracks().forEach(x=>x.stop()); vstream=null; Object.values(vpeers).forEach(pc=>pc.getSenders().forEach(s=>s.replaceTrack(null))); }
  else { if(myRole()==='listener') return toast(t('nomic'));
    try{ vstream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}}); }catch(e){ return toast(e.message); }
    Object.values(vpeers).forEach(pc=>pc.getSenders().forEach(s=>s.replaceTrack(curTrack()))); }
  renderVoice(); }
function voiceLeave(){ Object.keys(vpeers).forEach(drop); if(vstream){ vstream.getTracks().forEach(x=>x.stop()); vstream=null; } if(vc){ sb.removeChannel(vc); vc=null; } vjoined=false; }
let giftList=[];
async function giftPanel(){
  const g=$('#gf'); if(!g) return;
  const [{data:gs},{data:w}]=await Promise.all([sb.from('gifts').select('id,code,name,price_coins').eq('is_active',true).order('price_coins'),sb.from('wallets').select('balance').eq('user_id',user.id).maybeSingle()]);
  giftList=gs||[];
  g.innerHTML=`<div class="row"><b>🎁 ${t('gift')}</b><span class="gold">${t('bal')}: <span id="bl">${w?w.balance:0}</span></span></div><div class="row"><select id="gr" aria-label="${t('to')}"></select><select id="gg">${giftList.map(x=>`<option value="${x.id}">${esc(x.name[lang]||x.name.en)} · ${x.price_coins}</option>`).join('')}</select><button class="pri" id="gs">${t('gift')}</button></div>`;
  fillRecv();
  $('#gs').onclick=async()=>{ const r=$('#gr').value; if(!r) return toast(t('nogift'));
    const {error}=await sb.rpc('send_gift',{p_room:cur.id,p_receiver:r,p_gift:$('#gg').value,p_quantity:1,p_idempotency_key:crypto.randomUUID()});
    if(error) return toast(error.message); toast(t('gsent'));
    const {data:w2}=await sb.from('wallets').select('balance').eq('user_id',user.id).maybeSingle(); if($('#bl')) $('#bl').textContent=w2?w2.balance:0; };
}
function fillRecv(){ const r=$('#gr'); if(!r) return; const v=r.value;
  r.innerHTML=members.filter(m=>m.user_id!==user.id).map(m=>`<option value="${m.user_id}">${esc(names[m.user_id]||'?')}</option>`).join(''); if(v) r.value=v; }
async function nameOf(id){
  if(!names[id]){ const {data}=await sb.from('profiles').select('display_name').eq('id',id).single(); names[id]=data?.display_name||'?'; }
  return names[id];
}
async function addGift(e){
  const box=$('#chat'); if(!box) return; const [a,b]=await Promise.all([nameOf(e.sender_id),nameOf(e.receiver_id)]);
  const g=giftList.find(x=>x.id===e.gift_id); const gn=g?(g.name[lang]||g.name.en):'🎁';
  const d=document.createElement('div'); d.className='m gold'; d.textContent=`🎁 ${a} ${t('gmsg')} ${gn} ×${e.quantity} → ${b}`;
  box.appendChild(d); box.scrollTop=box.scrollHeight;
  const f=document.createElement('div'); f.className='fly'; f.textContent=(g&&g.code&&/^\p{Extended_Pictographic}/u.test(g.name.en))?'':'🎁'; f.textContent=f.textContent||'🎁';
  f.style.left=(10+Math.random()*75)+'vw'; document.body.appendChild(f); setTimeout(()=>f.remove(),2600);
}
async function addMsg(m){
  const box=$('#chat'); if(!box) return; const n=await nameOf(m.sender_id);
  const d=document.createElement('div'); d.className='m'; d.innerHTML=`<b>${esc(n)}</b> ${esc(m.body)}`;
  box.appendChild(d); box.scrollTop=box.scrollHeight;
}

async function loadMembers(){
  if(!cur) return;
  const {data}=await sb.from('room_members').select('user_id,role,seat_index,profiles(display_name)').eq('room_id',cur.id).is('left_at',null);
  members=data||[]; members.forEach(m=>names[m.user_id]=m.profiles?.display_name||'?');
  if(!$('#seats')) return;
  const me=members.find(m=>m.user_id===user.id);
  fillRecv(); $('#cnt').textContent=`${members.length}/${cur.capacity}`;
  let s=''; for(let i=0;i<cur.seat_count;i++){ const m=members.find(x=>x.seat_index===i);
    s+= m ? `<div class="seat"><div class="av ${m.role==='owner'?'own':''}">${esc((names[m.user_id]||'?')[0].toUpperCase())}</div><small>${esc(names[m.user_id])}</small></div>` : `<div class="seat"><div class="av empty">+</div></div>`; }
  $('#seats').innerHTML=s;
  $('#lis').innerHTML=members.filter(m=>m.seat_index==null).map(m=>`<span class="chip">${esc(names[m.user_id])}</span>`).join('');
  let a='';
  if(me && me.seat_index==null) a+=`<button class="sec" id="rq">${t('speak')}</button>`;
  if(me && rank(me.role)>=3){
    const {data:q}=await sb.from('speaker_requests').select('id,user_id').eq('room_id',cur.id).eq('status','pending');
    if(q&&q.length) a+=`<h3>${t('requests')}</h3>`+q.map(x=>`<div class="row"><span>${esc(names[x.user_id]||'?')}</span><span><button class="pri" data-a="1" data-id="${x.id}">${t('accept')}</button> <button class="sec" data-a="0" data-id="${x.id}">${t('reject')}</button></span></div>`).join('');
  }
  const acts=$('#acts'); if(!acts) return; acts.innerHTML=a;
  const rq=$('#rq'); if(rq) rq.onclick=async()=>{ const {error}=await sb.rpc('request_to_speak',{p_room:cur.id}); toast(error?error.message:t('sent')); };
  acts.querySelectorAll('button[data-id]').forEach(b=>b.onclick=async()=>{ const {error}=await sb.rpc('resolve_speaker_request',{p_request:b.dataset.id,p_accept:b.dataset.a==='1'}); if(error) toast(error.message); loadMembers(); });
}

sb.auth.onAuthStateChange((_e,s)=>{ const u=s?.user||null; if(u?.id===user?.id && view) return; user=u; setTimeout(route,0); });
document.documentElement.dir = lang==='ar'?'rtl':'ltr';
</script>
</body>
</html>
