<style>
:root{--bg:#0A0719;--sf:#141029;--sf2:#1D1738;--ol:#2E2552;--vi:#7C3AED;--mg:#D946EF;--gold:#F5C451;--cy:#4DD4E6;--tx:#fff;--tx2:#B7AEDB}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{background:radial-gradient(120% 60% at 50% -10%,#2a1060 0%,var(--bg) 60%) no-repeat,var(--bg);color:var(--tx);font-family:Cairo,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;gap:8px;align-items:center;padding:10px 16px;position:sticky;top:0;background:rgba(10,7,25,.92);backdrop-filter:blur(8px);z-index:5;border-bottom:1px solid var(--ol)}
.logo{font-size:24px;font-weight:700;background:linear-gradient(90deg,var(--vi),var(--mg));-webkit-background-clip:text;background-clip:text;color:transparent}
.sp{flex:1}
select,input{background:var(--sf);color:var(--tx);border:1px solid var(--ol);border-radius:12px;padding:12px;font:inherit;width:100%}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--mg);outline-offset:1px}
header select{width:auto;padding:6px 8px}
.c{max-width:560px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:12px}
h1{font-size:28px;line-height:1.3}h2{font-size:20px}h3{font-size:15px;color:var(--tx2);font-weight:600;margin-top:6px}
button{font:inherit;border:0;border-radius:22px;padding:12px 18px;color:#fff;cursor:pointer}
.pri{background:linear-gradient(90deg,var(--vi),var(--mg));box-shadow:0 0 18px rgba(124,58,237,.4);font-weight:700}
.sec{background:var(--sf2);border:1px solid var(--ol)}
.ghost{background:none;color:var(--tx2);padding:6px 10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card{background:var(--sf);border:1px solid var(--ol);border-radius:18px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
small,.note{color:var(--tx2)}
.gold{color:var(--gold)}
.note{background:var(--sf2);border-radius:12px;padding:10px;font-size:14px}
.seats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;text-align:center}
.seat small{display:block;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:56px;height:56px;border-radius:50%;margin:0 auto 4px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;background:linear-gradient(135deg,var(--vi),var(--mg))}
.av.own{box-shadow:0 0 0 3px var(--gold),0 0 16px rgba(245,196,81,.5)}
.av.empty{background:var(--sf);border:1px dashed var(--ol);color:var(--tx2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--sf2);border-radius:14px;padding:4px 10px;font-size:13px}
.chat{height:240px;overflow:auto;background:var(--sf);border:1px solid var(--ol);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px}
.m b{color:var(--cy)}
.send{display:flex;gap:8px}.send input{flex:1}
#toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));inset-inline:16px;background:var(--vi);padding:12px;border-radius:12px;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.show{opacity:1}
@keyframes fl{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1}100%{transform:translateY(-55vh) scale(1.6);opacity:0}}
.fly{position:fixed;bottom:18vh;font-size:44px;pointer-events:none;z-index:50;animation:fl 2.4s ease-out forwards}
@media (prefers-reduced-motion:reduce){.fly{animation-duration:.01s}}
@keyframes tk{50%{transform:scale(1.07)}}
.av.talk{box-shadow:0 0 0 3px #4dd0e1,0 0 20px rgba(77,208,225,.8);animation:tk .5s infinite}
.av.emo{font-size:30px}.ems{display:flex;flex-wrap:wrap;gap:8px}.ems button{font-size:24px;padding:6px 10px}.ems .on{outline:2px solid var(--gold)}
@media (prefers-reduced-motion:reduce){.av.talk{animation:none}}

body{background:radial-gradient(90% 50% at 15% -5%,#3b1a86 0%,transparent 60%) fixed,radial-gradient(70% 40% at 100% 0%,#6b1f7a55 0%,transparent 60%) fixed,var(--bg)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.c{animation:in .25s ease-out}
header{background:rgba(10,7,25,.7);backdrop-filter:blur(14px)}
button{transition:transform .12s,filter .12s}button:active{transform:scale(.96)}.pri:hover{filter:brightness(1.1)}

.cr{position:absolute;top:-12px;left:50%;transform:translateX(-50%);font-size:15px}
.seat{min-width:0}.seat[data-u],.chip[data-u]{cursor:pointer}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 4px}

.lv{font-size:11px;color:var(--gold);margin-inline-start:2px}

.av.xs{width:22px;height:22px;font-size:11px;margin:0;box-shadow:none}

.sh{width:100%;max-width:560px;background:var(--sf);border-top:1px solid var(--ol);border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;animation:in .2s}

function roomSettings2(){ closeSheet(); const me=members.find(x=>x.user_id===user.id), own=!!(me&&me.role==='owner'); const d=document.createElement('div'); d.id='sheet'; d.className='sheet';

  d.onclick=async e=>{ if(e.target===d) return closeSheet(); const b=e.target.closest('button'); if(!b) return; const k=b.dataset.k;
    if(k==='x') return closeSheet();

      r=await sb.rpc('set_slow_mode',{p_room:cur.id,p_seconds:sl}); if(r.error) return toast(r.error.message);
      cur.pinned=pin||null; cur.slow_seconds=sl; paintMeta(); closeSheet(); return toast(t('saved')); }
    if(k==='close'){ if(!confirm(t('closeAsk'))) return; closeSheet(); const {error}=await sb.rpc('close_room',{p_room:cur.id}); if(error) toast(error.message); loadMembers(); } };

function route(){

  if(pendingRoom){ const pr=pendingRoom; pendingRoom=null; try{ sessionStorage.removeItem('pr'); history.replaceState(null,'',location.pathname); }catch(e){}

function mkPeer(id){ const pc=new RTCPeerConnection(ICE); vpeers[id]=pc; pc._q=[];

async function onSig(p){ if(p.to!==user.id) return; let pc=vpeers[p.from];

    await pc.setLocalDescription(await pc.createAnswer()); vsend(p.from,{d:pc.localDescription}); }
  else if(p.d&&pc){ await pc.setRemoteDescription(p.d); pc._q.forEach(c=>pc.addIceCandidate(c).catch(()=>{})); pc._q=[]; }

  const card=id=>`<div class="card rc" data-u="${id}"><div class="av sm ${avCls(id)}">${avInner(id)}</div><div class="rb"><b>${esc(names[id]||'?')}</b></div><span>✉</span></div>`;
  const put=(sel,a)=>{ const e=$(sel); if(!e) return; e.innerHTML=a.length?a.map(card).join(''):`<p class="note">${t('nodm')}</p>`; e.querySelectorAll('.card').forEach(c=>c.onclick=()=>dmView(c.dataset.u)); };
  put('#fl',fl); put('#cv',cv);
}
async function dmView(uid){
  cleanup(); cur=null; dmPeer=uid; view='dm'; await nameOf(uid);
  app.innerHTML=hdr(true)+`<main class="c"><div class="row"><button class="ghost" id="bk">← ${t('bk')}</button><b>${esc(names[uid]||'?')}</b></div><div class="chat" id="dc" style="height:55vh"></div><div class="send"><input id="di" maxlength="1000" placeholder="${t('msg')}"><button class="pri" id="ds">➤</button></div></main>`;
  bindHdr(); const box=$('#dc');
  const add=m=>{ const e=document.createElement('div'); const mine=m.sender_id===user.id; e.className='m'+(mine?' me':''); const mm=/\[\[room:([0-9a-f-]{36})\]\]/.exec(m.body||''); e.textContent=mm?m.body.replace(mm[0],'').trim():m.body; if(m.id) e.dataset.id=m.id;
    if(mm){ const jb=document.createElement('button'); jb.className='pri'; jb.style.cssText='display:block;margin-top:6px;padding:6px 14px'; jb.textContent=t('invJoin'); jb.onclick=async()=>{ const r=await sb.rpc('join_room',{p_room:mm[1],p_password:null}); if(r.error) return toast(r.error.message); cur={id:mm[1]}; view='room'; openRoom(mm[1]); }; e.appendChild(jb); }
    if(mine){ const k=document.createElement('small'); k.className='tk'; k.style.cssText='margin-inline-start:6px;opacity:.9'; k.textContent=m.read_at?'✓✓ '+t('readMark'):'✓'; if(m.read_at) k.style.color='#4dd4e6'; e.appendChild(k); }
    box.appendChild(e); box.scrollTop=box.scrollHeight; };
  $('#bk').onclick=()=>{ if(dch){ sb.removeChannel(dch); dch=null; } view='inbox'; inboxView(); };
  const {data}=await sb.from('dms').select('id,sender_id,body,read_at').or(`and(sender_id.eq.${user.id},receiver_id.eq.${uid}),and(sender_id.eq.${uid},receiver_id.eq.${user.id})`).order('created_at',{ascending:false}).limit(50);
  (data||[]).reverse().forEach(add);
  sb.rpc('mark_dm_read',{p_peer:uid}).then(()=>refreshUnread());
  dch=sb.channel('dm-'+user.id)
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'dms',filter:'sender_id=eq.'+user.id},p=>{ if(!p.new.read_at) return; const el=box.querySelector('[data-id="'+p.new.id+'"] .tk'); if(el){ el.textContent='✓✓ '+t('readMark'); el.style.color='#4dd4e6'; } })
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'dms',filter:'receiver_id=eq.'+user.id},p=>{ if(p.new.sender_id===uid){ add(p.new); sb.rpc('mark_dm_read',{p_peer:uid}); } }).subscribe();
  const send=async()=>{ const b=$('#di').value.trim(); if(!b) return; $('#di').value=''; const {data:ins,error}=await sb.from('dms').insert({sender_id:user.id,receiver_id:uid,body:b}).select('id,read_at').single(); if(error) toast(error.message); else add({id:ins&&ins.id,sender_id:user.id,body:b,read_at:ins&&ins.read_at}); };
  $('#ds').onclick=send; $('#di').onkeydown=e=>{ if(e.key==='Enter') send(); };
}
</script>
